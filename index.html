<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道七日自駕遊</title>
<meta name="description" content="2026 北海道七日自駕遊：行程、航班、清單、住宿、公數袋">
<meta name="theme-color" content="#FFFCF6">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="北海道">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>:root {
  color-scheme: light only;
  --paper: #FFFCF6;
  --ink: #3E3A39;
  --coral: #F2A497;
  --yellow: #F6D27A;
  --mizu: #A8D3E6;
  --green: #B9DAA5;
  --muted: #7A7471;
  --line: 3px solid var(--ink);
  --r: 22px;
  --r-sm: 14px;
  --shadow: 3px 3px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px dashed var(--coral); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100vh; }
main { padding: calc(66px + env(safe-area-inset-top)) 16px 48px; }
main.with-banner { padding-top: calc(96px + env(safe-area-inset-top)); }
.page { display: flex; flex-direction: column; gap: 14px; }

/* ---------- 頂部固定選單 ---------- */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: var(--paper);
  border-bottom: var(--line);
  padding-top: env(safe-area-inset-top);
}
.topnav-inner {
  max-width: 560px; margin: 0 auto; padding: 8px 10px;
  display: grid; grid-template-columns: repeat(5, 1fr) 36px 36px; gap: 5px;
}
.nav-btn {
  border: var(--line); border-radius: 999px; background: var(--paper);
  padding: 6px 0; font-size: 15px; font-weight: 700;
  transition: transform .15s ease;
}
.nav-btn:active { transform: translateY(2px); }
.nav-btn.on { background: var(--coral); box-shadow: 2px 2px 0 var(--ink); }

/* ---------- 共用 ---------- */
.card {
  background: var(--paper); border: var(--line); border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card.plain { padding: 14px 16px; }
.title { margin: 4px 0 0; font-size: 28px; text-align: center; letter-spacing: 1px; }
.title.left, .subtitle.left { text-align: left; }
.subtitle { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.sec { margin: 10px 0 -2px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
.sec::before { content: ""; width: 12px; height: 12px; border: var(--line); border-radius: 50%; background: var(--yellow); }
.sec.small { font-size: 16px; margin-top: 4px; }
.sec.small::before { width: 9px; height: 9px; background: var(--mizu); }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.btn { white-space: nowrap;
  border: var(--line); border-radius: 999px; background: var(--coral);
  padding: 9px 18px; font-weight: 700; box-shadow: 2px 2px 0 var(--ink);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn.yellow { background: var(--yellow); }
.btn.ghost { background: var(--paper); }
.btn.full { width: 100%; }
.link-btn { border: none; background: none; padding: 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; margin-left: 12px; }
.link-btn:first-child { margin-left: 0; }
.link-btn.danger { color: #C4584A; }
.input {
  width: 100%; border: var(--line); border-radius: var(--r-sm); background: #fff;
  padding: 9px 12px; font-size: 16px; min-width: 0;
}
.input.tiny { width: 92px; padding: 4px 8px; font-size: 15px; }
.input.amt { flex: 0 0 38%; font-weight: 700; }
.add-row { display: flex; gap: 8px; }
.tag {
  display: inline-block; border: 2px solid var(--ink); border-radius: 999px;
  padding: 0 9px; font-size: 12.5px; font-weight: 700; line-height: 1.6; white-space: nowrap;
}
.must-tag { background: var(--yellow); }
.book-tag { background: var(--paper); border-style: dashed; }
.bar { height: 16px; border: var(--line); border-radius: 999px; background: #fff; overflow: hidden; padding: 2px; }
.bar-fill { height: 100%; background: var(--green); border-radius: 999px; transition: width .4s ease; }
.bar-fill.coral { background: var(--coral); }

/* ---------- 首頁 ---------- */
.hero { overflow: hidden; line-height: 0; }
.hero-svg { width: 100%; height: auto; display: block; }
.countdown { padding: 14px 16px; text-align: center; background: #FDF1D3; width: 100%; }
.countdown.today { background: #FBE1DB; }
.cd-label { font-weight: 700; }
.cd-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.cd-cell { background: var(--paper); border: var(--line); border-radius: var(--r-sm); padding: 6px 0; }
.cd-num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cd-unit { font-size: 13px; color: var(--muted); }
.cd-big { font-size: 22px; font-weight: 700; margin: 4px 0; }
.cd-foot { font-size: 13px; color: var(--muted); }

.flights { display: grid; gap: 12px; }
.flight { padding: 12px 16px; border-left-width: 12px; border-left-color: var(--accent); }
.flight-top { display: flex; justify-content: space-between; align-items: baseline; }
.flight-no { font-size: 20px; font-weight: 700; }
.flight-date { font-size: 14px; color: var(--muted); }
.flight-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 6px 0; }
.apt-code { font-size: 26px; font-weight: 700; line-height: 1.1; }
.apt-name { font-size: 13px; color: var(--muted); }
.apt-time { font-size: 17px; font-weight: 700; }
.apt.right { text-align: right; }
.flight-who { font-size: 13.5px; border-top: 2px dashed var(--ink); padding-top: 6px; }

.overview { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ov-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: left; border-radius: 18px; }
.ov-date { font-size: 12.5px; color: var(--muted); }
.ov-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
.quick { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

/* ---------- 行程 ---------- */
.day-rail {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
}
.day-rail::-webkit-scrollbar { display: none; }
.day-pill {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  border: var(--line); border-radius: 18px; background: var(--paper); padding: 6px 12px; min-width: 70px;
  scroll-snap-align: center; transition: transform .15s ease;
}
.day-pill.on { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); transform: translateY(-2px); }
.dp-n { font-size: 11.5px; font-weight: 700; }
.dp-d { font-size: 18px; font-weight: 700; line-height: 1.2; }
.dp-w { font-size: 12px; color: var(--muted); }

.day-head { display: flex; gap: 12px; align-items: center; padding: 12px; background: #EAF4F8; }
.dh-date { font-size: 13px; color: var(--muted); }
.dh-title { font-size: 22px; font-weight: 700; line-height: 1.25; }
.dh-intro { font-size: 13.5px; }

.tl-section { margin-top: 14px; }
.grp-head { border: var(--line); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 14px; display: inline-block; margin-bottom: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 61px; top: 10px; bottom: 10px;
  border-left: 3px dashed var(--ink);
}
.tl-item { display: grid; grid-template-columns: 50px 24px 1fr; gap: 0; align-items: start; margin-bottom: 12px; animation: pop-in .45s cubic-bezier(.3,1.6,.5,1) both; }
.tl-time { font-weight: 700; font-size: 15px; padding-top: 12px; font-variant-numeric: tabular-nums; }
.tl-dot { width: 16px; height: 16px; border: var(--line); border-radius: 50%; margin: 14px 0 0 4px; position: relative; z-index: 1; }
.tl-card { padding: 10px 12px; border-radius: 18px; box-shadow: 2px 2px 0 var(--ink); }
.tl-card.must { background: #FFF6DE; }
.tl-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.tl-tags:empty { display: none; }
.tl-name { font-weight: 700; font-size: 17px; line-height: 1.35; }
.tl-dish { font-size: 14px; color: #B5574A; font-weight: 700; }
.tl-note { font-size: 13.5px; color: var(--muted); }
.tl-note a { font-weight: 700; }
.tl-links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.tl-links a {
  border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-size: 13.5px; font-weight: 700;
  text-decoration: none; background: var(--paper);
}
.tl-links a.go { background: var(--mizu); }
.stay .tl-links .link-btn { margin-right: 4px; }

/* ---------- 清單／住宿 ---------- */
.page-head { display: flex; align-items: center; gap: 12px; }
.side-art { width: 104px; height: auto; flex: 0 0 auto; }
.todo-list, .exp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo { display: flex; align-items: center; padding: 8px 10px 8px 12px; border-radius: 16px; box-shadow: 2px 2px 0 var(--ink); transition: background .2s; }
.todo.done { background: #EEF6E8; }
.todo-label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.todo-label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check { width: 24px; height: 24px; border: var(--line); border-radius: 8px; background: #fff; flex: 0 0 auto; position: relative; transition: background .15s; }
.todo-label input:checked + .check { background: var(--green); animation: check-pop .3s ease; }
.todo-label input:checked + .check::after {
  content: ""; position: absolute; left: 6px; top: 1px; width: 6px; height: 12px;
  border: solid var(--ink); border-width: 0 3px 3px 0; transform: rotate(45deg);
}
.todo-label input:focus-visible + .check { outline: 3px dashed var(--coral); outline-offset: 2px; }
.todo.done .todo-text { text-decoration: line-through; color: var(--muted); }
.x { border: none; background: none; font-size: 22px; line-height: 1; padding: 4px 6px; color: var(--muted); }
.addr { font-size: 17px; margin: 4px 0; }

/* ---------- 公數袋 ---------- */
.kitty-sum { padding: 14px 16px; background: #FBE7E2; display: grid; gap: 10px; }
.ks-row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.ks-l { font-size: 13px; color: var(--muted); }
.ks-v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ks-v.neg, .neg { color: #C4584A; }
.pos { color: #4E8A3A; }
.ks-foot { font-size: 13px; text-align: center; }
.warn { color: #C4584A; font-weight: 700; }
.exp-form { display: grid; gap: 10px; position: relative; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); padding: 3px 12px; font-size: 14px; font-weight: 700; }
.chip.small { padding: 2px 10px; font-size: 13px; }
.chip.on { background: var(--yellow); }
.toast { text-align: center; font-weight: 700; font-size: 14px; color: #4E8A3A; animation: pop-in .35s cubic-bezier(.3,1.6,.5,1); }
.round { display: grid; gap: 8px; }
.round-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.round-title { font-weight: 700; }
.round-grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.grp-dot { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; font-weight: 700; font-size: 13px; flex: 0 0 auto; }
.person { border: 2px solid var(--ink); border-radius: 999px; background: #fff; padding: 3px 12px; font-size: 14px; font-weight: 700; transition: background .15s, transform .15s; }
.person.paid { background: var(--green); }
.person:active { transform: scale(.94); }
.round-foot { display: flex; justify-content: space-between; font-size: 13.5px; border-top: 2px dashed var(--ink); padding-top: 8px; }
.settle { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.settle th { text-align: right; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 0 2px 6px; }
.settle td { text-align: right; padding: 6px 2px; border-top: 2px dashed #CFC8C4; }
.settle th:first-child, .settle td:first-child, .settle th:nth-child(2), .settle td:nth-child(2) { text-align: center; }
.settle td:last-child { font-weight: 700; }
.exp { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 16px; box-shadow: 2px 2px 0 var(--ink); }
.exp-what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exp-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.rate { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; flex-wrap: wrap; }

/* ---------- 動畫 ---------- */
@keyframes bounce-in {
  0% { opacity: 0; transform: translateY(18px) scale(.97); }
  55% { opacity: 1; transform: translateY(-6px) scale(1.01); }
  80% { transform: translateY(2px); }
  100% { transform: none; }
}
@keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes check-pop { 50% { transform: scale(1.25); } }
@keyframes float { 50% { transform: translateY(-3px); } }
@keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(14px); } 100% { transform: translateX(0); } }
@keyframes drift-small { 50% { transform: translateX(4px); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fall {
  0% { transform: translate(0, -10px) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translate(30px, 200px) rotate(260deg); opacity: 0; }
}
@keyframes pop { 0%, 100% { transform: scale(.85); } 50% { transform: scale(1.1); } }
@keyframes steam { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-3px); opacity: .5; } }
@keyframes fly { 50% { transform: translate(2px, -3px) rotate(-2deg); } }
@keyframes glow { 50% { opacity: .55; } }
@keyframes wave { 50% { transform: translateX(3px); } }
@keyframes scuttle { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
@keyframes tick { to { transform: rotate(360deg); } }

.bounce-in { animation: bounce-in .55s cubic-bezier(.3,1.4,.5,1) both; }
.bob { animation: float 1.6s ease-in-out infinite; }
.bob-2 { animation-delay: .5s; }
.drift { animation: drift 9s ease-in-out infinite; }
.drift-2 { animation-duration: 12s; animation-delay: -3s; }
.drift-small { animation: drift-small 4s ease-in-out infinite; }
.sway { animation: sway 3.2s ease-in-out infinite; transform-box: view-box; }
.spin-slow { animation: spin 24s linear infinite; transform-box: view-box; }
.fall { animation: fall 7s linear infinite; }
.pop { animation: pop 1.8s ease-in-out infinite; transform-box: view-box; }
.pop-2 { animation-delay: .9s; }
.steam { animation: steam 2.2s ease-in-out infinite; }
.fly { animation: fly 2.4s ease-in-out infinite; }
.glow { animation: glow 2.4s ease-in-out infinite; }
.wave { animation: wave 2s ease-in-out infinite; }
.scuttle { animation: scuttle 1.4s ease-in-out infinite; }
.tick { animation: tick 10s steps(12) infinite; transform-box: view-box; }
.coin { animation: float 1.2s ease-in-out infinite; }

/* ---------- 編輯／同步 ---------- */
.lock-btn { position: relative; border: var(--line); border-radius: 50%; background: var(--paper); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; align-self: center; }
.lock-btn.on { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
.sync-dot { position: absolute; right: -3px; top: -3px; width: 13px; height: 13px; border: 2px solid var(--ink); border-radius: 50%; }
.sync-dot.inline { position: static; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.sync-line { text-align: center; font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.edit-banner { position: fixed; left: 0; right: 0; top: calc(59px + env(safe-area-inset-top)); z-index: 49; background: var(--yellow); border-bottom: var(--line); text-align: center; font-size: 13px; font-weight: 700; padding: 3px 0; }
.edit-btn { border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 700; font-size: 13.5px; padding: 2px 12px; flex: 0 0 auto; align-self: flex-start; }
.edit-btn.small { margin-left: auto; }
.dh-body { flex: 1; min-width: 0; }
.book-tag.ok { background: var(--green); border-style: solid; }
.lock-note { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; width: 100%; border-style: dashed; box-shadow: none; }
.person:disabled { cursor: default; opacity: 1; }
.danger-btn { color: #C4584A; }
.sheet-back { position: fixed; inset: 0; z-index: 100; background: rgba(62,58,57,.35); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 26px 26px 0 0; border-bottom: none; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: none; animation: sheet-up .35s cubic-bezier(.3,1.3,.5,1); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-size: 20px; }
.form { display: grid; gap: 12px; margin-top: 8px; }
.form-row { display: flex; gap: 8px; }
.fld { display: grid; gap: 4px; flex: 1; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 700; color: var(--muted); }
textarea.input { resize: vertical; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- 時間輸入（iOS 修正） ---------- */
.input.time { -webkit-appearance: none; appearance: none; min-width: 0; width: 100%; max-width: 100%; display: block; text-align: left; height: 46px; line-height: 1.2; }
.input.time::-webkit-date-and-time-value { text-align: left; }
.input.time.big { font-size: 26px; font-weight: 700; height: 60px; text-align: center; }
.input.time.big::-webkit-date-and-time-value { text-align: center; }
.fld.narrow { flex: 0 0 116px; }
.form-row .fld { overflow: hidden; padding: 0 1px 2px; }

/* ---------- 拖拉 ---------- */
.tl-item { position: relative; transition: transform .2s ease; }
.timeline.dragging .tl-item { user-select: none; -webkit-user-select: none; }
.tl-item.lifted .tl-card { box-shadow: 5px 6px 0 var(--ink); background: #FFF6DE; }
.tl-card { position: relative; }
.drag-handle {
  position: absolute; right: 2px; top: 2px; width: 44px; height: 40px;
  display: flex; justify-content: center; align-items: center;
  touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; opacity: .75;
}
.drag-handle:active { cursor: grabbing; opacity: 1; }
.timeline .tl-card .tl-tags, .timeline .tl-card .tl-name { padding-right: 0; }
.app .tl-card:has(.drag-handle) .tl-tags { padding-right: 40px; min-height: 22px; }
.hint.center { text-align: center; margin: 8px 0 0; }
.ask-q { margin: 0; font-size: 16px; font-weight: 700; }

/* ---------- PIN ---------- */
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 10px 0 4px; }
.pin-dot { width: 18px; height: 18px; border: var(--line); border-radius: 50%; background: #fff; transition: background .12s; }
.pin-dot.on { background: var(--coral); }
.pin-msg { text-align: center; min-height: 22px; color: #C4584A; font-weight: 700; font-size: 14px; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.key { border: var(--line); border-radius: 18px; background: var(--paper); font-size: 26px; font-weight: 700; padding: 12px 0; box-shadow: 2px 2px 0 var(--ink); }
.key:active { transform: translate(2px, 2px); box-shadow: none; background: var(--yellow); }
.key.fn { font-size: 16px; background: #F4EFE8; }

/* ---------- 語言 ---------- */
